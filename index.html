<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Siddhi Energy Solar Products & Solutions Catalog"><title>Siddhi Energy Catalog</title><style>
:root{--green:#087f5b;--blue:#075985;--ink:#102a43;--muted:#627d98;--bg:#f4f8f7;--card:#fff;--line:#d9e5e2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}#app{min-height:100vh;background:var(--bg)}header{background:linear-gradient(135deg,var(--green),var(--blue));color:white;padding:28px 5vw 34px}header .top{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:30px}header p{margin:7px 0 0;opacity:.9}.search{margin-top:24px;background:white;border:0;border-radius:14px;padding:15px 18px;width:100%;font-size:16px;outline:0}.wrap{max-width:1200px;margin:auto;padding:28px 5vw}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 16px;cursor:pointer}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:.2s;box-shadow:0 5px 18px #174b3a10}.card:hover{transform:translateY(-3px)}.logo{height:105px;border-radius:14px;background:#edf7f3;display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--green);overflow:hidden}.media{width:100%;height:100%;object-fit:cover;border-radius:14px}.video{width:100%;max-height:300px;border-radius:14px;margin-top:10px;background:#000}.tag{font-size:12px;color:var(--muted);margin-top:15px}.card h3{margin:7px 0}.spec{color:var(--muted);font-size:14px;line-height:1.5}.btn{display:inline-block;margin-top:14px;padding:10px 14px;border:0;border-radius:10px;background:var(--green);color:white;cursor:pointer}.panel{display:none;background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:25px}.panel.show{display:block}.back{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:0}.detail{display:grid;grid-template-columns:280px 1fr;gap:28px;margin-top:20px}.table{width:100%;border-collapse:collapse}.table td{padding:10px;border-bottom:1px solid var(--line)}.table td:first-child{font-weight:700;width:35%}.wa{background:#16a34a}.empty{text-align:center;color:var(--muted);padding:40px}@media(max-width:650px){.detail{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><div id="app"><header><div class="top"><div><h1>Siddhi Energy</h1><p>Solar Products & Solutions Catalog</p></div><div><button class="btn" onclick="adminLogin()">🔐 Admin</button> <strong>☀️</strong></div></div><input id="search" class="search" placeholder="Search brand, product, capacity..."/></header><main class="wrap"><section id="detail" class="panel"></section><section id="admin" class="panel"><h2>Catalog Admin</h2><p class="spec">Add, edit or delete products. Changes are saved in this browser.</p><div class="detail"><div><input id="pbrand" class="search" placeholder="Brand"/><input id="pcat" class="search" placeholder="Category"/><input id="pname" class="search" placeholder="Product name"/><input id="pimage" class="search" placeholder="Photo URL (optional)"/><input id="pvideo" class="search" placeholder="Video URL (optional)"/></div><div><input id="pspec" class="search" placeholder="Short specifications"/><input id="pwarranty" class="search" placeholder="Warranty"/><textarea id="pdetails" class="search" rows="5" placeholder="Details: Capacity=5 kW, Type=On-Grid, Technology=TOPCon"></textarea><button class="btn" onclick="saveProduct()">＋ Save Product</button> <button class="btn" onclick="closeAdmin()">Close</button></div></div><div id="adminList"></div></section><div id="chips" class="chips"></div><div id="grid" class="grid"></div></main></div><script>
const seedProducts=[
{id:1,brand:'Fujiyama',cat:'Inverter',name:'Fujiyama On-Grid Inverter 5 kW',spec:'5 kW • On-Grid • Single/Three Phase',warranty:'5 Years',details:{Capacity:'5 kW',Type:'On-Grid',Warranty:'5 Years',Use:'Residential / Commercial'}},
{id:2,brand:'Fujiyama',cat:'Inverter',name:'Fujiyama On-Grid Inverter 10 kW',spec:'10 kW • On-Grid • Three Phase',warranty:'5 Years',details:{Capacity:'10 kW',Type:'On-Grid',Warranty:'5 Years',Use:'Commercial'}},
{id:3,brand:'Adani',cat:'Solar Panel',name:'Adani TOPCon Solar Module',spec:'N-Type TOPCon • High efficiency • DCR options',warranty:'As per model',details:{Technology:'N-Type TOPCon',Category:'Solar PV Module',Warranty:'As per model',Use:'Rooftop / Utility'}},
{id:4,brand:'Waaree',cat:'Solar Panel',name:'Waaree Mono PERC / TOPCon Module',spec:'High-efficiency mono module • Multiple wattages',warranty:'As per model',details:{Technology:'Mono PERC / TOPCon',Category:'Solar PV Module',Warranty:'As per model',Use:'Rooftop / Commercial'}},
{id:5,brand:'Growatt',cat:'Inverter',name:'Growatt On-Grid Inverter',spec:'Residential & commercial string inverter',warranty:'As per model',details:{Type:'On-Grid String Inverter',Warranty:'As per model',Use:'Residential / Commercial'}},
{id:6,brand:'Solis',cat:'Inverter',name:'Solis Grid-Tied Inverter',spec:'String inverter • Multiple capacities',warranty:'As per model',details:{Type:'Grid-Tied String Inverter',Warranty:'As per model',Use:'Residential / Commercial'}},
{id:7,brand:'Siddhi Energy',cat:'Structure',name:'Solar Mounting Structure',spec:'Box Pipe / C-Channel • Customised',warranty:'As applicable',details:{Options:'Box Pipe, C-Channel',Material:'GI / MS options',Use:'Rooftop Solar'}},
{id:8,brand:'Siddhi Energy',cat:'Accessories',name:'Solar BOS & Installation Accessories',spec:'DC/AC cables, connectors, earthing & BOS',warranty:'As applicable',details:{Category:'Balance of System',Use:'Solar Installation'}},
{id:9,brand:'Waaree',cat:'Solar Package',name:'Waaree 3KW Solar Package – ₹2,00,000',spec:'3 kW • On-Grid • Residential Rooftop Package',warranty:'As per selected model',details:{Brand:'Waaree',Capacity:'3 kW',Type:'On-Grid',Price:'₹2,00,000',Panels:'Waaree solar modules',Use:'Residential Rooftop'},image:'https://cdn11.bigcommerce.com/s-unnwlv5df8/images/stencil/1280x1280/products/494/1592/Mono_Half_Cut_7__83653.1693823268.1280.1280__72237.1756191890.jpg?c=1'}];
let products=JSON.parse(localStorage.getItem('siddhi_products')||'null')||seedProducts;let editId=null;
let active='All';const chips=document.getElementById('chips'),grid=document.getElementById('grid'),detail=document.getElementById('detail'),search=document.getElementById('search');
function renderChips(){const cats=['All',...new Set(products.map(p=>p.cat))];chips.innerHTML=cats.map(c=>`<button class="chip ${active===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function render(){const q=search.value.toLowerCase();const list=products.filter(p=>(active==='All'||p.cat===active)&&JSON.stringify(p).toLowerCase().includes(q));grid.innerHTML=list.length?list.map(p=>`<article class="card" onclick="openProduct(${p.id})"><div class="logo">${p.brand}</div><div class="tag">${p.cat}</div><h3>${p.name}</h3><div class="spec">${p.spec}</div><button class="btn">View Details</button></article>`).join(''):`<div class="empty">No products found.</div>`}
function setCat(c){active=c;renderChips();render()}function openProduct(id){const p=products.find(x=>x.id===id);detail.classList.add('show');detail.innerHTML=`<button class="back" onclick="closeProduct()">← Back to Catalog</button><div class="detail"><div class="logo">${p.brand}</div><div><div class="tag">${p.cat}</div><h2>${p.name}</h2><p class="spec">${p.spec}</p><table class="table">${Object.entries(p.details).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table><button class="btn wa" onclick="enquire('${p.name.replaceAll("'","\\'")}')">WhatsApp Enquiry</button></div></div>`;detail.scrollIntoView({behavior:'smooth'})}function closeProduct(){detail.classList.remove('show');detail.innerHTML=''}function enquire(name){window.open('https://wa.me/919717113545?text='+encodeURIComponent('Hello Siddhi Energy, I am interested in: '+name),'_blank')}
function adminLogin(){const pin=prompt('Enter Admin PIN');if(pin==='1234'){document.getElementById('admin').classList.add('show');renderAdmin();document.getElementById('admin').scrollIntoView({behavior:'smooth'})}else if(pin!==null)alert('Wrong PIN')}function closeAdmin(){document.getElementById('admin').classList.remove('show')}function renderAdmin(){document.getElementById('adminList').innerHTML=products.map(p=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${p.brand}</b> — ${p.name} <button class="btn" onclick="editProduct(${p.id})">Edit</button> <button class="btn" onclick="deleteProduct(${p.id})">Delete</button></div>`).join('')}function editProduct(id){const p=products.find(x=>x.id===id);editId=id;pbrand.value=p.brand;pcat.value=p.cat;pname.value=p.name;pspec.value=p.spec;pwarranty.value=p.warranty;pdetails.value=Object.entries(p.details).map(([k,v])=>k+'='+v).join(', ')}function saveProduct(){const brand=pbrand.value.trim(),cat=pcat.value.trim(),name=pname.value.trim(),spec=pspec.value.trim(),warranty=pwarranty.value.trim();if(!brand||!cat||!name){alert('Brand, category and product name are required');return}const details={};pdetails.value.split(',').forEach(x=>{const a=x.split('=');if(a[0]&&a[1])details[a[0].trim()]=a.slice(1).join('=').trim()});if(editId){const p=products.find(x=>x.id===editId);Object.assign(p,{brand,cat,name,spec,warranty,details});editId=null}else products.push({id:Date.now(),brand,cat,name,spec,warranty,details});localStorage.setItem('siddhi_products',JSON.stringify(products));['pbrand','pcat','pname','pspec','pwarranty','pdetails'].forEach(id=>document.getElementById(id).value='');renderChips();render();renderAdmin();alert('Product saved')}function deleteProduct(id){if(confirm('Delete this product?')){products=products.filter(p=>p.id!==id);localStorage.setItem('siddhi_products',JSON.stringify(products));renderChips();render();renderAdmin()}}search.addEventListener('input',render);renderChips();render();
</script><script>
function render(){const q=search.value.toLowerCase();const list=products.filter(p=>(active==='All'||p.cat===active)&&JSON.stringify(p).toLowerCase().includes(q));grid.innerHTML=list.length?list.map(p=>`<article class="card" onclick="openProduct(${p.id})"><div class="logo">${p.image?'<img class="media" src="'+p.image+'" alt="'+p.name+'">':p.brand}</div><div class="tag">${p.cat}${p.video?' • 🎬 Video':''}</div><h3>${p.name}</h3><div class="spec">${p.spec}</div><button class="btn">View Details</button></article>`).join(''):`<div class="empty">No products found.</div>`}
function openProduct(id){const p=products.find(x=>x.id===id);detail.classList.add('show');detail.innerHTML=`<button class="back" onclick="closeProduct()">← Back to Catalog</button><div class="detail"><div><div class="logo">${p.image?'<img class="media" src="'+p.image+'" alt="'+p.name+'">':p.brand}</div>${p.video?'<video class="video" controls playsinline src="'+p.video+'"></video>':''}</div><div><div class="tag">${p.cat}</div><h2>${p.name}</h2><p class="spec">${p.spec}</p><table class="table">${Object.entries(p.details).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table><button class="btn wa" onclick="enquire('${p.name.replaceAll("'","\\'")}')">WhatsApp Enquiry</button></div></div>`;detail.scrollIntoView({behavior:'smooth'})}
function editProduct(id){const p=products.find(x=>x.id===id);editId=id;pbrand.value=p.brand;pcat.value=p.cat;pname.value=p.name;pimage.value=p.image||'';pvideo.value=p.video||'';pspec.value=p.spec;pwarranty.value=p.warranty;pdetails.value=Object.entries(p.details).map(([k,v])=>k+'='+v).join(', ')}
function saveProduct(){const brand=pbrand.value.trim(),cat=pcat.value.trim(),name=pname.value.trim(),image=pimage.value.trim(),video=pvideo.value.trim(),spec=pspec.value.trim(),warranty=pwarranty.value.trim();if(!brand||!cat||!name){alert('Brand, category and product name are required');return}const details={};pdetails.value.split(',').forEach(x=>{const a=x.split('=');if(a[0]&&a[1])details[a[0].trim()]=a.slice(1).join('=').trim()});if(editId){const p=products.find(x=>x.id===editId);Object.assign(p,{brand,cat,name,image,video,spec,warranty,details});editId=null}else products.push({id:Date.now(),brand,cat,name,image,video,spec,warranty,details});localStorage.setItem('siddhi_products',JSON.stringify(products));['pbrand','pcat','pname','pimage','pvideo','pspec','pwarranty','pdetails'].forEach(id=>document.getElementById(id).value='');renderChips();render();renderAdmin();alert('Product saved')}
renderChips();render();
</script></body></html>
